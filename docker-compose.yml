name: usc-safe-route

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: app
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-safe}:${POSTGRES_PASSWORD:-safe}@db:5432/${POSTGRES_DB:-saferoute}
    DATA_DIR: /data
  volumes:
    - ./backend:/app
    - ./algorithm:/app/algorithm   # Desh's risk model package (import algorithm.*)
    - ./data:/data

services:
  db:
    # Ships PostgreSQL 16 + TimescaleDB (community/TSL features) + PostGIS
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safe}
      POSTGRES_DB: ${POSTGRES_DB:-saferoute}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safe} -d ${POSTGRES_DB:-saferoute}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    command: sh -c "flask db upgrade && gunicorn -c gunicorn.conf.py wsgi:app"
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ingestor:
    <<: *backend
    command: python ingestor.py
    depends_on:
      api:
        condition: service_healthy   # api runs migrations first
    restart: unless-stopped

  # One-off data tooling (tippecanoe + geo stack). Usage:
  #   docker compose run --rm tools bash scripts/build_buildings.sh
  tools:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"   # write data/ files as you, not root
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-safe}:${POSTGRES_PASSWORD:-safe}@db:5432/${POSTGRES_DB:-saferoute}
      DATA_DIR: /data
      HOME: /tmp
    depends_on:
      db:
        condition: service_healthy
    command: bash

volumes:
  pgdata:
